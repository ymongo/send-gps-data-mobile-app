# F-Droid build recipe — Send GPS Data (Android)
#
# Reference copy of the metadata submitted to fdroid/fdroiddata
# (metadata/com.mongoutils.sendgpsdata.yml). F-Droid builds from THAT file;
# this copy only documents what is submitted.
# Docs: https://f-droid.org/docs/Build_Metadata_Reference/
#
# appId: com.mongoutils.sendgpsdata — minSdk 26, targetSdk 36, compileSdk 36
# Summary, description, icon, screenshots and changelogs live in fastlane/
# (upstream repo) and are NOT duplicated in the fdroiddata metadata.

Categories:
  - Navigation
  - System

License: MIT

AuthorName: ymongo

WebSite: https://github.com/ymongo/send-gps-data-mobile-app
SourceCode: https://github.com/ymongo/send-gps-data-mobile-app
IssueTracker: https://github.com/ymongo/send-gps-data-mobile-app/issues
Changelog: https://github.com/ymongo/send-gps-data-mobile-app/blob/master/RELEASE_NOTES.md

Donate:
  - https://getalby.com/lightning/p/greenpond2749@getalby.com

RepoType: git
Repo: https://github.com/ymongo/send-gps-data-mobile-app

Builds:
  - versionName: '0.1.2'
    versionCode: 3
    # fdroiddata rejects tags and branches here: the submitted metadata carries
    # the full commit hash of the v0.1.2 tag. This copy keeps the tag readable.
    commit: v0.1.2
    # Gradle module dir of the npm-workspace monorepo: fdroidserver runs the
    # `build:` script AND Gradle with this as cwd, and looks for the APK in
    # <subdir>/build/outputs/apk/release.
    subdir: apps/mobile/android/app
    # One Gradle driver only: fdroidserver runs `assembleRelease` itself.
    gradle:
      - yes
    build: |
      # Rise to the npm workspace ROOT so the `gps-shared` workspace resolves,
      # then build the web bundle Capacitor needs before Gradle runs.
      cd ../../../..
      npm ci --ignore-scripts
      cd apps/mobile
      NODE_OPTIONS="--max-old-space-size=4096" npm run prod
      npx cap sync android

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '0.1.2'
CurrentVersionCode: 3
