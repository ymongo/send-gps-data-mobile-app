<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Méridienne — icône de notification monochrome (piste glm-5.3)</title>
  <desc>Variante renforcée du glyphe pour la barre d'état : bras épais, point agrandi, blanc uni. Lisible à 16 dp, formes pleines, aucun contour.</desc>
  <!-- Axes latitude/longitude : quatre capsules pleines renforcées -->
  <g fill="#FFFFFF">
    <rect x="10.5" y="2" width="3" height="5" rx="1.5"/>
    <rect x="10.5" y="17" width="3" height="5" rx="1.5"/>
    <rect x="2" y="10.5" width="5" height="3" rx="1.5"/>
    <rect x="17" y="10.5" width="5" height="3" rx="1.5"/>
    <!-- La position : disque central dominant -->
    <circle cx="12" cy="12" r="4"/>
  </g>
</svg>
